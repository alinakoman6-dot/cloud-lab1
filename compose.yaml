services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: LN2ip@43hd
      MYSQL_DATABASE: kindergartens
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: kindergartens
      DB_USER: root
      DB_PASSWORD: LN2ip@43hd
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: